<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박상기 | AI 전문가</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #f0f2f5;
      color: #333;
      font-size: 16px;
      line-height: 1.6;
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #1F3864;
      color: #fff;
      text-align: center;
      padding: 48px 24px 36px;
    }

    .avatar-wrap {
      margin-bottom: 20px;
    }

    /* 프로필 사진이 있으면 <img> 태그로 교체하세요 */
    .avatar-placeholder {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      color: rgba(255,255,255,0.8);
    }

    .name-line {
      font-size: 1.6rem;   /* 본문(16px)의 1.6배 */
      font-weight: 700;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Body ── */
    .body {
      padding: 32px 24px 40px;
    }

    /* Bio */
    .bio {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.75;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    /* Contact */
    .contact {
      margin-bottom: 32px;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .contact-label {
      color: #1F3864;
      font-weight: 700;
      min-width: 50px;
      flex-shrink: 0;
    }

    .contact-value {
      color: #333;
      word-break: break-all;
    }

    /* Section */
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #1F3864;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 2px solid #1F3864;
      padding-bottom: 6px;
      margin-bottom: 18px;
    }

    /* Career */
    .career {
      margin-bottom: 36px;
    }

    .career-item {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .career-year {
      font-size: 0.8rem;
      color: #1F3864;
      font-weight: 600;
      min-width: 90px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .career-desc {
      font-size: 0.9rem;
      color: #333;
    }

    .career-role {
      font-weight: 600;
    }

    .career-org {
      font-size: 0.82rem;
      color: #666;
      margin-top: 2px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 15px 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      border: none;
      transition: opacity 0.15s;
      font-family: inherit;
    }

    .btn:active { opacity: 0.75; }

    .btn-primary {
      background: #1F3864;
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      color: #1F3864;
      border: 2px solid #1F3864;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #333;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive: wider screens ── */
    @media (min-width: 480px) {
      .card {
        margin: 32px auto;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        min-height: unset;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="header">
    <div class="avatar-wrap">
      <img class="avatar-placeholder" src="profile.jpeg" alt="박상기 프로필" style="object-fit:cover;">
    </div>
    <p class="name-line">박상기 &middot; AI 전문가 &middot; 컨설턴트 &amp; 강사</p>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Bio -->
    <p class="bio">
      해운·물류 업계에서 쌓은 현장 경험을 바탕으로<br>
      AI 컨설팅과 강의를 통해 디지털 전환을 돕고 있습니다.<br>
      현재는 자원봉사와 역사문화 홍보 기자로도 활동 중입니다.
    </p>

    <!-- Contact -->
    <div class="contact">
      <div class="contact-item">
        <span class="contact-label">Email</span>
        <span class="contact-value">skp6102@naver.com</span>
      </div>
      <div class="contact-item">
        <span class="contact-label">Tel</span>
        <span class="contact-value" id="phone-number">010-5512-8764</span>
      </div>
    </div>

    <!-- Career -->
    <div class="career">
      <p class="section-title">경력</p>

      <div class="career-item">
        <span class="career-year">~ 2024.12</span>
        <div>
          <p class="career-role">해운·물류 전문가</p>
          <p class="career-org">한진해운 · 스타오션라인 · 에스엠상선경인터미널</p>
        </div>
      </div>

      <div class="career-item">
        <span class="career-year">2026 – 현재</span>
        <div>
          <p class="career-role">자원봉사 활동가</p>
        </div>
      </div>

      <div class="career-item">
        <span class="career-year">2026 – 현재</span>
        <div>
          <p class="career-role">역사문화명소 홍보 기자</p>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="buttons">
      <a class="btn btn-primary" href="mailto:skp6102@naver.com">이메일 보내기</a>
      <button class="btn btn-outline" onclick="copyPhone()">전화 걸기</button>
    </div>

  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast">전화번호가 복사되었습니다 ✓</div>

<script>
  function copyPhone() {
    var phone = document.getElementById('phone-number').textContent.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(phone).then(showToast).catch(fallbackCopy.bind(null, phone));
    } else {
      fallbackCopy(phone);
    }
  }

  function fallbackCopy(text) {
    var el = document.createElement('textarea');
    el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.focus();
    el.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(el);
    showToast();
  }

  function showToast() {
    var t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }
</script>

</body>
</html>
